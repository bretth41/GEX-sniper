<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SPY SNIPER · LOG</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#040507;--surface:#080b0e;--surface2:#0d1117;
  --border:#181e26;--border2:#242d36;
  --text:#a8bcc4;--dim:#384550;--dim2:#506070;
  --amber:#f5a623;--green:#18d46c;--red:#f02848;--white:#e0eaee;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:11px;padding:16px}

.page-hdr{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;
  border-bottom:1px solid var(--border);padding-bottom:12px;flex-wrap:wrap}
.logo{font-family:'Syncopate',sans-serif;font-size:12px;font-weight:700;color:var(--amber)}
.page-date{font-size:10px;color:var(--dim2)}
.refresh-info{font-size:9px;color:var(--dim);margin-left:auto}
.btn{background:none;border:1px solid var(--border2);color:var(--dim2);
  font-family:'JetBrains Mono',monospace;font-size:9px;padding:4px 10px;
  border-radius:2px;cursor:pointer;margin-left:8px}
.btn-copy:hover{border-color:var(--amber);color:var(--amber)}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

.summary{display:flex;gap:20px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:14px 18px;margin-bottom:20px}
.sum-block{flex-shrink:0}
.sum-lbl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}
.sum-val{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--white)}
.sum-sub{font-size:9px;color:var(--dim2);margin-top:2px}
.sum-div{width:1px;background:var(--border2);margin:0 4px;align-self:stretch}
.c-green{color:var(--green)}.c-amber{color:var(--amber)}.c-red{color:var(--red)}
.c-dim{color:var(--dim2)}

.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:6px 16px;font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:-1px}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}

.section-lbl{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:10px;min-width:900px}
th{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
  font-weight:400;padding:4px 8px 6px;border-bottom:1px solid var(--border);
  text-align:right;white-space:nowrap}
th:first-child,th:nth-child(2),th:nth-child(3){text-align:left}
td{padding:5px 8px;border-bottom:1px solid var(--border);
  text-align:right;white-space:nowrap;color:var(--dim2)}
td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface)}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:12px}
.sig-call{color:var(--green);font-weight:700}
.sig-put{color:var(--red);font-weight:700}
</style>
</head>
<body>

<div class="page-hdr">
  <div class="logo">SPY SNIPER &middot; LOG</div>
  <div class="page-date" id="pg-date"></div>
  <div class="refresh-info">Refreshes every 10s</div>
  <button class="btn btn-copy" id="btn-copy" onclick="copyLog()">COPY LOG</button>
  <button class="btn btn-clear" onclick="clearLog()">CLEAR LOG</button>
</div>

<div class="summary" id="summary"></div>

<div class="tabs">
  <div class="tab on" onclick="showTab('today')">TODAY</div>
  <div class="tab" onclick="showTab('all')">ALL SESSIONS</div>
</div>

<div class="section-lbl" id="tbl-lbl">TODAY'S SIGNALS</div>
<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th>TIME</th>
        <th>TYPE</th>
        <th>PRICE</th>
        <th>G1</th><th>F1</th><th>RQ</th><th>COMP</th>
        <th>ABSORP</th>
        <th>ABSORP TIMELINE</th>
        <th>TRAP</th>
        <th>MICRO</th>
        <th>FR</th><th>FP</th><th>FE</th><th>FTOT</th>
        <th>TRAP TS</th><th>MICRO TS</th><th>SIG EVENTS</th>
        <th>+2m</th><th>+5m</th><th>+10m</th><th>+15m</th><th>+30m</th>
        <th style="border-left:2px solid var(--border2);color:var(--amber)">ENTRY</th>
        <th style="color:var(--amber)">E+2m</th><th style="color:var(--amber)">E+5m</th><th style="color:var(--amber)">E+10m</th><th style="color:var(--amber)">E+15m</th><th style="color:var(--amber)">E+30m</th>
      </tr>
    </thead>
    <tbody id="tbl-body"></tbody>
  </table>
</div>
<div id="empty-msg" class="empty" style="display:none">No signals logged yet.</div>

<script>
var LOG_KEY = 'spy_sniper_log';
var LOG_MAX = 200;
var currentTab = 'today';

/* ── ET date string ── */
function etDateStr() {
  var n = new Date();
  var jan = new Date(n.getFullYear(),0,1).getTimezoneOffset();
  var jul = new Date(n.getFullYear(),6,1).getTimezoneOffset();
  var off = Math.min(jan,jul) !== jan ? -4 : -5;
  var e = new Date(n.getTime() + off*3600000 + n.getTimezoneOffset()*60000);
  var p = function(x){ return String(x).padStart(2,'0'); };
  return e.getFullYear()+'-'+p(e.getMonth()+1)+'-'+p(e.getDate());
}

/* ── Load log from localStorage ── */
function getLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
  catch(e) { return []; }
}

/* ── Color helpers ── */
function scoreColor(v) {
  if(v === null || v === undefined) return 'var(--dim2)';
  if(v > 0.2) return 'var(--green)';
  if(v < -0.2) return 'var(--red)';
  return 'var(--dim2)';
}
function absorpColor(s) {
  if(s === 'CONFIRMING') return 'var(--green)';
  if(s === 'CONVERGING') return 'var(--amber)';
  if(s === 'ABSORBING')  return 'var(--red)';
  return 'var(--dim2)';
}
function trapColor(s) {
  if(s === 'TRAP')      return 'var(--red)';
  if(s === 'TRAP RISK') return 'var(--amber)';
  return 'var(--dim2)';
}
function microColor(s) {
  if(s === 'ASK LEAD') return 'var(--green)';
  if(s === 'BID LEAD') return 'var(--red)';
  if(s === 'UNSTABLE') return 'var(--amber)';
  return 'var(--dim2)';
}
function fragColor(tot) {
  if(tot >= 3) return 'var(--red)';
  if(tot >= 2) return 'var(--amber)';
  return 'var(--dim2)';
}
function ftColor(entry, min) {
  var p = entry.ft ? entry.ft[String(min)] : null;
  if(p === null || p === undefined) return 'var(--dim)';
  var dir = entry.type === 'STRONG_CALL' ? 1 : -1;
  var move = (p - entry.price) * dir;
  if(move > 0.05)  return 'var(--green)';
  if(move < -0.05) return 'var(--red)';
  return 'var(--dim2)';
}
function ftText(entry, min) {
  var p = entry.ft ? entry.ft[String(min)] : null;
  if(p === null || p === undefined) return '&mdash;';
  var move = p - entry.price;
  return (move >= 0 ? '+' : '') + move.toFixed(2);
}

/* ── Format absorption timeline ── */
function fmtTimeline(tl) {
  if(!tl || !tl.length) return '&mdash;';
  function abbr(s) {
    if(s === 'ABSORBING')  return 'ABSRB';
    if(s === 'CONVERGING') return 'CONV';
    if(s === 'CONFIRMING') return 'CONF';
    return s;
  }
  function fmtSec(s) {
    var m = Math.floor(s/60);
    var sec = s % 60;
    return m + ':' + String(sec).padStart(2,'0');
  }
  return tl.map(function(t, i) {
    return i === 0 ? abbr(t.state) : abbr(t.state)+'('+fmtSec(t.elapsed)+')';
  }).join(' &rarr; ');
}

/* ── Format trap/micro timestamps and signal events ── */
function fmtTs(ts) {
  if(ts === null || ts === undefined) return '&mdash;';
  var m = Math.floor(ts/60), sec = ts % 60;
  return '+' + m + ':' + String(sec).padStart(2,'0');
}
function fmtSigEvents(ev) {
  if(!ev || !ev.length) return '&mdash;';
  return ev.map(function(e) {
    var m=Math.floor(e.elapsed/60), sec=e.elapsed%60;
    return e.event+'('+m+':'+String(sec).padStart(2,'0')+')';
  }).join(' ');
}

/* ── Build summary bar ── */
function buildSummary(entries) {
  var calls = entries.filter(function(e){ return e.type === 'STRONG_CALL'; });
  var puts  = entries.filter(function(e){ return e.type === 'STRONG_PUT'; });

  function winsAt(arr, min) {
    var settled = arr.filter(function(e){
      return e.ft && e.ft[String(min)] !== null && e.ft[String(min)] !== undefined;
    });
    var wins = settled.filter(function(e){
      var dir = e.type === 'STRONG_CALL' ? 1 : -1;
      return (e.ft[String(min)] - e.price) * dir > 0.05;
    });
    return { wins: wins.length, settled: settled.length,
      pct: settled.length ? Math.round(wins.length/settled.length*100) : null };
  }

  var s5  = winsAt(entries, 5);
  var s15 = winsAt(entries, 15);

  function pctClass(pct) {
    if(pct >= 70) return 'c-green';
    if(pct >= 50) return 'c-amber';
    return 'c-red';
  }

  var html = '';
  html += '<div class="sum-block"><div class="sum-lbl">STRONG CALLS</div>';
  html += '<div class="sum-val sig-call">'+calls.length+'</div></div>';
  html += '<div class="sum-div"></div>';
  html += '<div class="sum-block"><div class="sum-lbl">STRONG PUTS</div>';
  html += '<div class="sum-val sig-put">'+puts.length+'</div></div>';
  html += '<div class="sum-div"></div>';
  html += '<div class="sum-block"><div class="sum-lbl">TOTAL</div>';
  html += '<div class="sum-val">'+entries.length+'</div></div>';
  html += '<div class="sum-div"></div>';

  var p5cls  = s5.pct  !== null ? pctClass(s5.pct)  : 'c-dim';
  var p15cls = s15.pct !== null ? pctClass(s15.pct) : 'c-dim';
  html += '<div class="sum-block"><div class="sum-lbl">PROFITABLE @5m</div>';
  html += '<div class="sum-val '+p5cls+'">'+(s5.pct !== null ? s5.pct+'%' : '&mdash;')+'</div>';
  html += '<div class="sum-sub">'+s5.wins+'/'+s5.settled+' settled</div></div>';
  html += '<div class="sum-div"></div>';
  html += '<div class="sum-block"><div class="sum-lbl">PROFITABLE @15m</div>';
  html += '<div class="sum-val '+p15cls+'">'+(s15.pct !== null ? s15.pct+'%' : '&mdash;')+'</div>';
  html += '<div class="sum-sub">'+s15.wins+'/'+s15.settled+' settled</div></div>';

  if(calls.length > 0 && puts.length > 0) {
    var cs5 = winsAt(calls, 5);
    var ps5 = winsAt(puts,  5);
    html += '<div class="sum-div"></div>';
    html += '<div class="sum-block"><div class="sum-lbl">CALLS @5m</div>';
    html += '<div class="sum-val sig-call '+(cs5.pct !== null ? pctClass(cs5.pct) : 'c-dim')+'">';
    html += (cs5.pct !== null ? cs5.pct+'%' : '&mdash;')+'</div></div>';
    html += '<div class="sum-block"><div class="sum-lbl">PUTS @5m</div>';
    html += '<div class="sum-val sig-put '+(ps5.pct !== null ? pctClass(ps5.pct) : 'c-dim')+'">';
    html += (ps5.pct !== null ? ps5.pct+'%' : '&mdash;')+'</div></div>';
  }

  document.getElementById('summary').innerHTML = html;
}

/* ── Build table ── */
function buildTable(entries) {
  var tbody = document.getElementById('tbl-body');
  var empty = document.getElementById('empty-msg');
  if(!entries.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  var mins = [2,5,10,15,30];
  var rows = entries.map(function(e) {
    var fr = e.frag || {};
    var ftCols = mins.map(function(m) {
      var p = e.ft ? e.ft[String(m)] : null;
      if(p===null||p===undefined) return '—';
      var mv = p - e.price;
      return (mv>=0?'+':'')+mv.toFixed(2);
    });
    var entryCol = (function(){
      if(!e.entryPrice) return '—';
      var mv=e.entryPrice-e.price;
      var ee=e.entryElapsed||0;
      return (mv>=0?'+':'')+mv.toFixed(2)+'@'+Math.floor(ee/60)+':'+String(ee%60).padStart(2,'0');
    })();
    var eftCols = [2,5,10,15,30].map(function(m){
      var p = e.eft ? e.eft[String(m)] : null;
      if(p===null||p===undefined) return '—';
      var mv=p-(e.entryPrice||e.price);
      return (mv>=0?'+':'')+mv.toFixed(2);
    });
    return [
      e.time,
      e.type.replace('STRONG_','STR '),
      e.price ? e.price.toFixed(2) : '—',
      e.g1!==undefined?(e.g1>=0?'+':'')+e.g1:'—',
      e.f1!==undefined?(e.f1>=0?'+':'')+e.f1:'—',
      e.rq||'—',
      e.comp!==undefined?(e.comp>=0?'+':'')+e.comp:'—',
      e.absorp || '—',
      fmtTimelinePlain(e.absorpTimeline),
      (e.trap||'NEUTRAL')+(e.trapDetail?' ('+e.trapDetail+')':''),
      e.micro || '—',
      fr.R !== undefined ? fr.R : '—',
      fr.P !== undefined ? fr.P : '—',
      fr.E !== undefined ? fr.E : '—',
      fr.total !== undefined ? fr.total : '—',
      e.trapTs!==null&&e.trapTs!==undefined?'+'+Math.floor(e.trapTs/60)+':'+String(e.trapTs%60).padStart(2,'0'):'—',
      e.microTs!==null&&e.microTs!==undefined?'+'+Math.floor(e.microTs/60)+':'+String(e.microTs%60).padStart(2,'0'):'—',
      e.sigEvents&&e.sigEvents.length?e.sigEvents.map(function(ev){var m2=Math.floor(ev.elapsed/60),s2=ev.elapsed%60;return ev.event+'('+m2+':'+String(s2).padStart(2,'0')+')'}).join(' '):'—'
    ].concat(ftCols).concat([entryCol]).concat(eftCols).join('\t');
  }).join('\n');
  var label = currentTab==='today' ? today : 'ALL SESSIONS';
  var summary = [
    'SPY SNIPER SIGNAL LOG — ' + label,
    'Signals: '+entries.length
      +'  Calls: '+entries.filter(function(e){return e.type==='STRONG_CALL';}).length
      +'  Puts: '+entries.filter(function(e){return e.type==='STRONG_PUT';}).length,
    'Profitable @5m:  ' + s5info(),
    'Profitable @15m: ' + s15info(),
    '',
    header,
    rows
  ].join('\n');

  navigator.clipboard.writeText(summary).then(function() {
    var btn = document.getElementById('btn-copy');
    btn.textContent = 'COPIED!';
    btn.style.color = 'var(--green)';
    setTimeout(function(){ btn.textContent='COPY LOG'; btn.style.color=''; }, 2000);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = summary;
    ta.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:200px;z-index:9999;font-size:10px;background:#0d1117;color:#a8bcc4;border:1px solid #f5a623;padding:8px;';
    document.body.appendChild(ta);
    ta.select();
    alert('Clipboard blocked. Text selected above — copy manually (Cmd+C).');
    setTimeout(function(){ ta.remove(); }, 10000);
  });
}

/* ── Clear ── */
function clearLog() {
  if(!confirm('Clear the entire signal log? This cannot be undone.')) return;
  localStorage.removeItem(LOG_KEY);
  render();
}

/* ── Boot ── */
render();
setInterval(render, 10000);
</script>
</body>
</html>
